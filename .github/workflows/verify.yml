name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - run: sbt test
      - run: sbt "Test / runMain dev.noorps.fleetlake.FleetLakeBenchmark 200000 2 5"
      - uses: actions/upload-artifact@v4
        with:
          name: fleetlake-benchmark
          path: benchmarks/latest.json
